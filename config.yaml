# Mochi configuration (shared defaults).
# Put personal overrides in config.local.yaml (same structure, git-ignored) — see config.local.example.yaml.
agent:
  name: Mochi
  language: auto                          # auto = she answers in the language you write in; or a fixed language, e.g. Dutch, French, Japanese
  final_check: true                       # after a task that used tools, one quick "is everything done?" pass

llm:
  base_url: http://localhost:1234/v1      # LM Studio OpenAI-compatible server
  model: qwen3.6-35b-a3b                  # any tool-calling model loaded in LM Studio
  context_length: 32768                   # used when the launcher loads the model
  reasoning_effort: none                  # none | low | medium | high  (none = fastest)
  temperature: 0.3
  translator_model: ""                   # optional: a stronger multilingual model just for translate_text (e.g. gemma3:12b); empty = the main model
  learning_effort: ""                    # optional: reasoning effort (low|medium|high) used only when she is asked to learn something; slower
  max_steps: 40                           # tool-call iterations per user turn
  stream: true                            # stream replies so /stop can cut one short
  fast_model: ""                          # optional SMALL second local model for helper jobs (condensing long
                                          # pages). Needs spare VRAM next to the main model; empty = not used.
  lms_path: ""                            # empty = auto-detect (PATH or %USERPROFILE%\.lmstudio\bin\lms.exe)
  backend: auto                           # auto | lmstudio | openai. auto = use LM Studio's `lms` CLI if installed,
                                          # else just talk to the OpenAI-compatible server at base_url (Ollama,
                                          # llama.cpp, vLLM, hosted APIs). Linux has no `lms` by default.
  api_key_env: ""                         # name of an environment variable holding an API key for a hosted server
                                          # (e.g. MOCHI_API_KEY). Empty = no key (LM Studio / Ollama). Never put
                                          # the key itself in a config file.

skillspector:                            # NVIDIA SkillSpector scans every skill BEFORE it is installed or trusted
  enabled: true
  require: true                          # fail closed: if a skill cannot be scanned (scanner missing, crash, incomplete) it is NOT installed
  on_danger: block                       # block | ask: a DO_NOT_INSTALL verdict is refused outright; "ask" lets YOU decide (never her)
  llm: false                             # also run its LLM stage on the local Ollama model (deeper, slower; nothing leaves the PC)
  path: ""                               # empty = .skillspector/ made by setup, else `skillspector` on PATH
  timeout_s: 300

tools:
  groups: auto                            # auto = send the model only core tools + the groups a task needs
                                          # (faster, more focused); all = always send every tool

skills:
  auto_match: true                        # when a request clearly matches one skill, hand her the recipe directly

context:
  condense: true                          # when memory is full, summarise old tool results instead of cutting them
  summarize_over: 6000                    # with llm.fast_model set: condense page reads longer than this on arrival

sandbox:
  workspace: workspace                   # relative to this folder; Mochi reads/writes freely here
  # Extra folders Mochi may READ without asking (writes still need approval)
  read_allow:
    - assets                 # her own portrait and expression pictures
  # Never readable or writable, even with approval (credentials etc.)
  deny_globs:
    - "**/.env"
    - "**/.env.*"
    - "**/*.pem"
    - "**/*.key"
    - "**/*.pfx"
    - "**/id_rsa*"
    - "**/id_ed25519*"
    - "**/.ssh/**"
    - "**/credentials*"
    - "**/.aws/**"
    - "**/.git-credentials"

approvals:
  # Categories Mochi may do ON HER OWN without asking. Empty = always ask (safest).
  # Options: launch (start apps), desktop (control app windows / mouse / keyboard), browser_action (click/fill
  # in her own browser), schedule, clipboard, process, network_write, video (make_video renders on her own).
  # Never auto-allowed (always ask): delete, write_outside, read_outside, overwrite, shell, python.
  # Even when trusted, sensitive targets still ask: terminals, Run box, Registry Editor, Task Manager, installers,
  # shells like PowerShell/cmd, Win+R-style hotkeys. Deleting files and writing outside the workspace always ask.
  auto_allow: []

shell:
  timeout_s: 120
  # Commands whose FIRST token matches one of these run without approval (read-only)
  auto_allow:
    - Get-ChildItem
    - Get-Content
    - Get-Date
    - Get-Process
    - Get-Location
    - Test-Path
    - Measure-Object
    - Select-String
    - dir
    - ls
    - type
    - echo
    - whoami
    - hostname
  # Linux only (added to auto_allow / hard_deny when Mochi runs on Linux). Read-only commands; file readers such
  # as cat/grep are left out on purpose, use read_file / search_files instead.
  auto_allow_posix: [ls, pwd, date, whoami, hostname, uname, echo, df, free, uptime, id, which, ps, lscpu]
  hard_deny_posix:
    - "rm -rf /*"
    - "rm -rf / "
    - "rm -rf ~"
    - "--no-preserve-root"
    - "mkfs"
    - "dd if="
    - ":(){"
    - "chmod -R 777 /"
  # Substrings that are always refused
  hard_deny:
    - "format-volume"
    - "format c:"
    - "diskpart"
    - "bcdedit"
    - "vssadmin delete"
    - "cipher /w"
    - "reg delete hklm"
    - "Remove-Item C:\\ "
    - "rm -rf /"
    - "Set-ExecutionPolicy Unrestricted"
    - "Invoke-Expression (New-Object Net.WebClient"
    - "iwr -useb"

comfyui:
  url: http://127.0.0.1:8188
  path: ""                              # where ComfyUI is installed, for comfy_start (empty = ~/ComfyUI)
  free_llm_before: true                  # unload Ollama's language model from the GPU before a ComfyUI job (it reloads by itself)
  default_checkpoint: ""                  # empty = first checkpoint ComfyUI reports

video:
  # "Mochi Studio": a command that turns a small JSON script into a finished, voiced short (tools make_video and
  # list_my_videos; recipe in skills/make-video.md). Empty = the video tools are not offered.
  # Set it in config.local.yaml, e.g.  command: ["C:/path/python.exe", "C:/path/mochi-studio/studio.py"]
  command: []
  timeout_s: 1800

scheduler:
  task_folder: Mochi                      # Windows Task Scheduler folder (scheduling is Windows-only)
