<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__NAME__</title>
<style>
:root{
  --bg:#17121c; --panel:#201929; --panel2:#2a2136; --line:#3a2f48; --text:#f1eaf7; --dim:#a79bb6;
  --pink:#ff7eb6; --pink2:#d94f93; --green:#5fd6a0; --red:#ff6b7a; --yellow:#ffc857; --code:#120e17;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#fbf6fb; --panel:#ffffff; --panel2:#f4eaf4; --line:#e6d6e6; --text:#2a1f33; --dim:#7b6c88;
         --pink:#d94f93; --pink2:#b83a7a; --green:#1f9d6a; --red:#d6334a; --yellow:#b27a00; --code:#f1e7f1; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header img{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid var(--pink)}
header .t b{display:block;font-size:16px}
header .t span{font-size:12px;color:var(--dim)}
header .sp{flex:1}
select,button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover,select:hover{border-color:var(--pink)}
button.primary{background:var(--pink2);border-color:var(--pink2);color:#fff}
button.danger{border-color:var(--red);color:var(--red)}
button:disabled{opacity:.45;cursor:default}
#chat{flex:1;overflow-y:auto;padding:20px 0}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
.row{display:flex;gap:10px;margin:14px 0;align-items:flex-start}
.row.user{justify-content:flex-end}
.row .av{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:top;flex:none;border:1px solid var(--pink)}
.bubble{max-width:88%;padding:10px 14px;border-radius:16px;overflow-wrap:anywhere}
.user .bubble{background:var(--pink2);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
.bot .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.bubble p{margin:.4em 0}.bubble p:first-child{margin-top:0}.bubble p:last-child{margin-bottom:0}
.bubble code{background:var(--code);padding:1px 5px;border-radius:5px;font:13px Consolas,monospace}
.bubble pre{background:var(--code);padding:10px 12px;border-radius:10px;overflow-x:auto;margin:.6em 0}
.bubble pre code{padding:0;background:none}
.bubble h1,.bubble h2,.bubble h3{margin:.6em 0 .3em;font-size:1.05em;color:var(--pink)}
.bubble ul,.bubble ol{margin:.4em 0;padding-left:1.4em}
.bubble a{color:var(--pink)}
.bubble table{border-collapse:collapse;margin:.5em 0}.bubble td,.bubble th{border:1px solid var(--line);padding:3px 8px}
.bubble img.pic{max-width:100%;border-radius:10px;margin-top:6px;display:block}
.queued{opacity:.65}
.meta{font-size:12px;color:var(--dim);margin:2px 0 0 44px}
.step{margin:4px 0 4px 44px;font-size:13px;color:var(--dim);border-left:2px solid var(--line);padding-left:10px}
.step summary{cursor:pointer;list-style:none}
.step summary::-webkit-details-marker{display:none}
.step .n{color:var(--pink)}
.step.err .n{color:var(--red)}
.step pre{white-space:pre-wrap;margin:4px 0;font:12px Consolas,monospace;max-height:220px;overflow:auto;color:var(--dim)}
.note{margin:6px 0 6px 44px;font-size:12px;color:var(--dim)}
.approval{margin:12px 0 12px 44px;border:1px solid var(--yellow);border-radius:12px;padding:12px 14px;background:var(--panel)}
.approval h4{margin:0 0 6px;color:var(--yellow);font-size:14px}
.approval pre{white-space:pre-wrap;margin:0 0 10px;font:13px Consolas,monospace;max-height:200px;overflow:auto}
.approval .btns{display:flex;gap:8px}
.approval.done{border-color:var(--line);opacity:.7}
.typing:empty::after,.typing p:last-child::after,.typing li:last-child::after,.typing h3:last-child::after{content:"▍";color:var(--pink);animation:b 1s steps(2) infinite;margin-left:1px}
@keyframes b{50%{opacity:0}}
.think{margin:6px 0 6px 44px;color:var(--dim);font-size:13px}
.think i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pink);margin-right:3px;animation:p 1.2s infinite}
.think i:nth-child(2){animation-delay:.2s}.think i:nth-child(3){animation-delay:.4s}
@keyframes p{0%,80%,100%{opacity:.25}40%{opacity:1}}
.hero{text-align:center;margin-top:12vh;color:var(--dim)}
.hero img{width:130px;border-radius:50%;border:3px solid var(--pink);margin-bottom:10px}
.hero h2{color:var(--text);margin:.2em 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.chips button{border-radius:20px}
footer{border-top:1px solid var(--line);background:var(--panel);padding:12px 0}
.box{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;max-height:180px;min-height:44px;font:inherit;color:var(--text);background:var(--panel2);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
textarea:focus{border-color:var(--pink)}
.hint{font-size:12px;color:var(--dim);margin-top:6px}
#banner{display:none;background:var(--panel2);color:var(--yellow);text-align:center;padding:6px;font-size:13px}
</style>
</head>
<body>
<header>
  <img src="/avatar.png?t=__TOKEN__" alt="">
  <div class="t"><b>__NAME__</b><span id="sub">starting…</span></div>
  <div class="sp"></div>
  <select id="models" title="Model" style="max-width:260px"></select>
  <button id="reset" title="Start a new conversation">New chat</button>
  <button id="stop" class="danger" style="display:none">■ Stop</button>
</header>
<div id="banner"></div>
<div id="chat"><div class="wrap" id="log"></div></div>
<footer><div class="wrap">
  <div class="box">
    <textarea id="inp" rows="1" placeholder="Message __NAME__…  (Enter to send, Shift+Enter for a new line)"></textarea>
    <button id="send" class="primary">Send</button>
  </div>
  <div class="hint">While she works you can still type: your message reaches her before her next step.</div>
</div></footer>

<script>
const TOKEN="__TOKEN__", NAME="__NAME__";
const $=id=>document.getElementById(id);
const log=$("log"), chat=$("chat"), inp=$("inp");
let since=0, cur=null, curText="", busy=false, ready=false, thinkEl=null, stick=true;
const AV="/avatar.png?t="+TOKEN;

const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s=s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<i>$2</i>");
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function md(src){
  const lines=src.replace(/\r/g,"").split("\n"); let out="", i=0, list=null;
  const close=()=>{if(list){out+="</"+list+">";list=null}};
  while(i<lines.length){
    let l=lines[i];
    if(/^```/.test(l)){
      close(); let code=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
      i++; out+="<pre><code>"+esc(code.join("\n"))+"</code></pre>"; continue;
    }
    let m;
    if((m=l.match(/^(#{1,3})\s+(.*)/))){close();out+="<h3>"+inline(m[2])+"</h3>";i++;continue}
    if((m=l.match(/^\s*[-*]\s+(.*)/))){ if(list!=="ul"){close();out+="<ul>";list="ul"} out+="<li>"+inline(m[1])+"</li>";i++;continue}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){ if(list!=="ol"){close();out+="<ol>";list="ol"} out+="<li>"+inline(m[1])+"</li>";i++;continue}
    if(/^\|.*\|\s*$/.test(l)){
      close(); let rows=[];
      while(i<lines.length && /^\|.*\|\s*$/.test(lines[i])){ if(!/^\|[\s:|-]+\|\s*$/.test(lines[i])) rows.push(lines[i]); i++; }
      out+="<table>"+rows.map((r,k)=>"<tr>"+r.replace(/^\||\|\s*$/g,"").split("|").map(c=>(k?"<td>":"<th>")+inline(c.trim())+(k?"</td>":"</th>")).join("")+"</tr>").join("")+"</table>"; continue;
    }
    if(!l.trim()){close();i++;continue}
    close(); let p=[l]; i++;
    while(i<lines.length && lines[i].trim() && !/^(```|#{1,3}\s|\s*[-*]\s|\s*\d+[.)]\s|\|)/.test(lines[i])) p.push(lines[i++]);
    out+="<p>"+p.map(inline).join("<br>")+"</p>";
  }
  close(); return out;
}

function scroll(){ if(stick) chat.scrollTop=chat.scrollHeight; }
chat.addEventListener("scroll",()=>{stick=chat.scrollHeight-chat.scrollTop-chat.clientHeight<80});
function add(el){ clearThink(); log.appendChild(el); scroll(); return el; }
function mk(cls,html){const d=document.createElement("div");d.className=cls;d.innerHTML=html||"";return d}
function hero(){
  if($("hero")) return;
  const h=mk("hero",`<img src="${AV}"><h2>Hi, I'm ${esc(NAME)} 🍡</h2><div>Ask me anything or give me a task.</div>
   <div class="chips"></div>`); h.id="hero";
  const ex=["What's the weather like today?","Tidy up my Downloads folder","Summarize a PDF for me","Make me a short video"];
  ex.forEach(t=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>{inp.value=t;sendMsg()};h.querySelector(".chips").appendChild(b)});
  log.appendChild(h);
}
function clearHero(){const h=$("hero");if(h)h.remove()}
function userBubble(text,queued){
  clearHero(); cur=null;
  const r=mk("row user"+(queued?" queued":""),""); const b=mk("bubble",""); b.textContent=text+(queued?"  (sent while she works)":""); r.appendChild(b); add(r);
}
function botBubble(){
  const r=mk("row bot",`<img class="av" src="${AV}">`); const b=mk("bubble typing",""); r.appendChild(b); add(r); return b;
}
function think(){
  if(thinkEl) return;
  thinkEl=mk("think","<i></i><i></i><i></i> thinking"); log.appendChild(thinkEl); scroll();
}
function clearThink(){ if(thinkEl){thinkEl.remove();thinkEl=null} }
function endCur(){ if(cur){cur.classList.remove("typing");cur.innerHTML=md(curText);} cur=null; curText=""; pending=""; }

// ---- typewriter: tokens arrive in uneven bursts, so they are queued and shown at a steady pace
let pending="", evq=[], lastT=0, dirty=false;
function pump(){
  while(evq.length){
    const e=evq[0];
    if(e.kind==="token"){ pending+=e.text; evq.shift(); continue; }
    if(pending.length) break;          // let her finish typing before the next step appears
    evq.shift(); handle(e);
  }
}
function frame(t){
  const dt=Math.min(t-(lastT||t),60); lastT=t;
  pump();
  if(pending.length){
    if(!cur){ clearThink(); cur=botBubble(); curText=""; }
    // reveal a share of the backlog each frame: a drip when little is waiting, a quick catch-up when a lot is
    const n=Math.max(1,Math.ceil(pending.length*dt/140));
    curText+=pending.slice(0,n); pending=pending.slice(n); dirty=true;
  }
  if(dirty && cur){ cur.innerHTML=md(curText); dirty=false; scroll(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function setBusy(b){
  busy=b; $("stop").style.display=b?"":"none"; $("sub").textContent=b?"working…":(ready?$("sub").dataset.base:"starting…");
  $("reset").disabled=b; $("models").disabled=b;
  if(!b) clearThink();
}

function handle(e){
  switch(e.kind){
    case "status": showBanner(e.text); break;
    case "ready":
      ready=true; showBanner(""); $("sub").dataset.base=`${e.model} · ${e.tools} tools`; $("sub").textContent=busy?"working…":$("sub").dataset.base;
      if(!log.children.length) hero(); loadModels(); break;
    case "fatal": showBanner("Could not start: "+e.text); $("sub").textContent="offline"; break;
    case "user": userBubble(e.text,e.queued); break;
    case "busy": setBusy(true); think(); break;
    case "thinking": endCur(); clearThink(); think(); break;
    case "token":
      break;   // tokens are fed to the typewriter by pump()
    case "tool_call": {
      endCur(); clearThink();
      const d=document.createElement("details"); d.className="step"; d.id="s"+e.id;
      d.innerHTML=`<summary><span class="n">→ ${esc(e.name)}</span> <span>${esc(e.args.slice(0,110))}</span></summary><pre></pre>`;
      d.querySelector("pre").textContent=e.args; add(d); think(); break; }
    case "tool_result": {
      const steps=log.querySelectorAll("details.step"); const d=steps[steps.length-1];
      if(d){ if(e.error) d.classList.add("err"); d.querySelector("pre").textContent+="\n\n"+e.result; }
      break; }
    case "picture": {
      const r=mk("row bot",`<img class="av" src="${AV}">`); const b=mk("bubble","");
      const im=new Image(); im.className="pic"; im.alt=e.name; im.onload=scroll;
      im.src="/file?t="+TOKEN+"&p="+encodeURIComponent(e.rel); b.appendChild(im); r.appendChild(b); add(r); break; }
    case "info": add(mk("note", ({skill:"📖 using her skill: ",steer:"↪ she read your message: ",check:"✓ double-checking the answer",
      nudge:"↻ nudging her to finish",condense:"⇣ memory is full, condensing",image:"👀 looking at an image"}[e.what]||"")+esc(e.text||""))); break;
    case "approval": {
      clearThink(); const a=mk("approval","");
      a.id="ap"+e.aid; a.innerHTML=`<h4>Approval needed: ${esc(e.category)}</h4><pre></pre><div class="btns">
        <button class="primary" data-a="y">Allow</button><button data-a="a">Always this session</button><button class="danger" data-a="n">Deny</button></div>`;
      a.querySelector("pre").textContent=e.summary;
      a.querySelectorAll("button").forEach(b=>b.onclick=()=>post("/approve",{id:e.aid,answer:b.dataset.a}));
      add(a); break; }
    case "approval_done": {
      const a=$("ap"+e.aid); if(a){a.classList.add("done"); const bt=a.querySelector(".btns");
        bt.textContent=({y:"✓ Allowed",a:"✓ Always allowed this session",n:"✗ Denied"})[e.answer]||""; }
      think(); break; }
    case "done":
      clearThink();
      if(cur && curText.trim()===e.answer.trim()){ endCur(); }
      else { endCur(); if(e.answer.trim()){ const b=botBubble(); b.classList.remove("typing"); b.innerHTML=md(e.answer); } }
      add(mk("meta",`${e.secs}s${e.stopped?" · stopped":""}`)); break;
    case "error": endCur(); add(mk("note","⚠ "+esc(e.text))); break;
    case "idle": endCur(); setBusy(false); inp.focus(); break;
    case "reset": log.innerHTML=""; cur=null; pending=""; curText=""; hero(); break;
  }
}

function showBanner(t){const b=$("banner");b.textContent=t;b.style.display=t?"block":"none"}
async function api(path,opt){
  opt=opt||{}; opt.headers=Object.assign({"X-Mochi-Token":TOKEN},opt.headers||{});
  return (await fetch(path,opt)).json();
}
function post(path,body){return api(path,{method:"POST",body:JSON.stringify(body),headers:{"Content-Type":"application/json"}})}

async function loop(){
  for(;;){
    try{
      const r=await api("/poll?since="+since);
      for(const e of r.events){ since=Math.max(since,e.id); evq.push(e); }
    }catch(err){ showBanner("Lost connection to her… retrying"); await new Promise(r=>setTimeout(r,1500)); }
  }
}
async function loadModels(){
  try{
    const r=await api("/models"); const s=$("models"); s.innerHTML="";
    (r.models||[]).forEach(m=>{const o=document.createElement("option");o.value=m.key;
      o.textContent=m.key+(m.tools?"":" (no tools)")+(m.vision?" 👁":"");o.selected=m.current;s.appendChild(o)});
  }catch(e){}
}
$("models").onchange=async e=>{
  const key=e.target.value; showBanner("Switching model…"); $("models").disabled=true;
  const r=await post("/model",{key}); if(r.status!=="ok") showBanner(r.status); else showBanner("");
  $("models").disabled=false; loadModels();
};
async function sendMsg(){
  const text=inp.value.trim(); if(!text) return;
  if(!ready){ showBanner("She is still waking up, one moment…"); return; }
  inp.value=""; inp.style.height="auto"; stick=true;
  const r=await post("/send",{text});
  if(r.status==="busy") showBanner("Wait until she finishes before doing that.");
}
$("send").onclick=sendMsg;
$("stop").onclick=()=>post("/stop",{});
$("reset").onclick=()=>{ if(confirm("Start a new conversation? She will forget this one.")) post("/send",{text:"/reset"}); };
inp.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMsg()} });
inp.addEventListener("input",()=>{inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,180)+"px"});
api("/info").then(i=>{ if(!i.ready) $("sub").textContent="waking up…"; });
hero(); loop(); inp.focus();
</script>
</body>
</html>
